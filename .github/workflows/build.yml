# =============================================================================
# OBS Broadcast Overlay System — GitHub Actions CI/CD
# =============================================================================
# Builds the plugin on Windows, Linux (Ubuntu), and macOS with every push
# and pull request. Uploads compiled binaries as build artifacts.
#
# OBS SDK Strategy:
#   - Ubuntu:  libobs-dev from the official OBS PPA (apt)
#   - Windows: Pre-built OBS SDK zip from GitHub releases
#   - macOS:   OBS .app bundle via Homebrew cask (CMake config inside bundle)
#
# =============================================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      obs_version:
        description: 'OBS Studio version to build against'
        required: true
        default: '31.0.2'
        type: string

# ── Concurrency: cancel in-flight runs for the same PR ────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true

# ── Environment Variables ────────────────────────────────────────────────
env:
  OBS_VERSION: ${{ inputs.obs_version || '31.0.2' }}
  PLUGIN_NAME: obs-broadcast-plugin
  CMAKE_BUILD_TYPE: RelWithDebInfo

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD MATRIX
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: ${{ matrix.display-name }}
    strategy:
      fail-fast: false  # Keep building other OSes even if one fails
      matrix:
        include:
          - os: ubuntu-24.04
            display-name: '🐧 Ubuntu 24.04'
            shell: bash
            generator: Ninja
            cmake-prefix: /usr/lib/x86_64-linux-gnu/cmake
            artifact-suffix: linux-x86_64
            binary-glob: |
              build/libobs-broadcast-plugin.so*
              build/**/libobs-broadcast-plugin.so*

          - os: windows-2022
            display-name: '🪟 Windows 2022'
            shell: pwsh
            generator: Visual Studio 17 2022
            cmake-arch: '-A x64 -T host=x64'
            cmake-prefix: ${{ github.workspace }}/obs-sdk/lib/cmake
            artifact-suffix: windows-x64
            binary-glob: |
              build/**/obs-broadcast-plugin.dll
              build/**/obs-broadcast-plugin.pdb

          - os: macos-15
            display-name: '🍏 macOS 15'
            shell: bash
            generator: Ninja
            cmake-prefix: /Applications/OBS.app/Contents/Frameworks/cmake
            artifact-suffix: macOS-universal
            binary-glob: |
              build/libobs-broadcast-plugin.so
              build/**/libobs-broadcast-plugin.so

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── ccache (faster rebuilds) ──────────────────────────────────────
      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ env.OBS_VERSION }}
          max-size: 500M

      # ══════════════════════════════════════════════════════════════════
      # INSTALL OBS SDK — Platform Specific
      # ══════════════════════════════════════════════════════════════════

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:obsproject/obs-studio -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libobs-dev \
            cmake \
            ninja-build \
            pkg-config \
            build-essential

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/obs-studio-$env:OBS_VERSION-windows-x64.zip"
          $zipPath = "$env:TEMP\obs-sdk.zip"
          $extractPath = "${{ github.workspace }}\obs-sdk"

          Write-Host "::group::Downloading OBS SDK $env:OBS_VERSION"
          Write-Host "URL: $sdkUrl"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath -UseBasicParsing
          Write-Host "::endgroup::"

          Write-Host "::group::Extracting OBS SDK"
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Remove-Item $zipPath -Force
          Write-Host "Extracted to: $extractPath"
          Get-ChildItem "$extractPath/obs-studio" | Select-Object Name
          Write-Host "::endgroup::"

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

          # Check if OBS is already installed (from cache)
          if [[ ! -d "/Applications/OBS.app" ]]; then
            brew install --cask obs-studio
          else
            echo "OBS.app found in /Applications"
          fi

          # Verify CMake config exists inside the .app bundle
          EXPECTED_DIR="/Applications/OBS.app/Contents/Frameworks/cmake"
          if [[ -d "$EXPECTED_DIR" ]]; then
            echo "OBS CMake config found at $EXPECTED_DIR"
          else
            echo "::warning::OBS CMake config not found at $EXPECTED_DIR"
            echo "::warning::Trying alternative locations..."
            find "/Applications/OBS.app" -name "libobsConfig.cmake" -type f 2>/dev/null || true
          fi

      # ══════════════════════════════════════════════════════════════════
      # CMAKE CONFIGURE
      # ══════════════════════════════════════════════════════════════════

      - name: Configure CMake
        run: |
          cmake -S obs-broadcast-plugin -B build `
            -G "${{ matrix.generator }}" `
            ${{ matrix.cmake-arch || '' }} `
            ${{ runner.os != 'Windows' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache' || '' }} `
            ${{ matrix.generator == 'Ninja' && format('-DCMAKE_BUILD_TYPE={0}', env.CMAKE_BUILD_TYPE) || '' }} `
            -DCMAKE_PREFIX_PATH="${{ matrix.cmake-prefix }}" `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      # ══════════════════════════════════════════════════════════════════
      # BUILD
      # ══════════════════════════════════════════════════════════════════

      - name: Build Plugin
        run: |
          cmake --build build --config "${{ env.CMAKE_BUILD_TYPE }}" --parallel $(nproc 2>/dev/null || echo 2)

      # ══════════════════════════════════════════════════════════════════
      # INSTALL
      # ══════════════════════════════════════════════════════════════════

      - name: Install Plugin
        run: |
          cmake --install build --config "${{ env.CMAKE_BUILD_TYPE }}" --prefix "${{ github.workspace }}/install"

      # ══════════════════════════════════════════════════════════════════
      # PACKAGE ARTIFACTS
      # ══════════════════════════════════════════════════════════════════

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p artifacts/plugin artifacts/data

          # ── Find compiled plugin binary ─────────────────────────────
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows: search for .dll and .pdb
            BINARY=$(find build -name "obs-broadcast-plugin.dll" -type f | head -1)
            PDB=$(find build -name "obs-broadcast-plugin.pdb" -type f | head -1)
            if [[ -n "$BINARY" ]]; then
              cp "$BINARY" artifacts/plugin/
              echo "Copied DLL: $BINARY"
            fi
            if [[ -n "$PDB" ]]; then
              cp "$PDB" artifacts/plugin/
              echo "Copied PDB: $PDB"
            fi
          else
            # Unix: search for .so
            BINARY=$(find build -name "libobs-broadcast-plugin.so*" -type f | head -1)
            if [[ -n "$BINARY" ]]; then
              cp "$BINARY" artifacts/plugin/
              echo "Copied SO: $BINARY"
            fi
          fi

          # ── Copy data directory (shaders + locale) ─────────────────
          if [[ -d "obs-broadcast-plugin/data" ]]; then
            cp -r obs-broadcast-plugin/data/* artifacts/data/
            echo "Copied data files"
          fi

          # ── List what we have ──────────────────────────────────────
          echo "::group::Artifact contents"
          find artifacts -type f | sort
          echo "::endgroup::"

      - name: Upload Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact-suffix }}-${{ env.OBS_VERSION }}
          path: artifacts/
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════════════
  # RELEASE (triggered by version tags)
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: '📦 Create Release'
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release

          # Package each platform's artifacts into a tar.gz/zip
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [[ "$name" == *"windows"* ]]; then
              (cd "$dir" && 7z a -tzip "../../release/${name}.zip" .)
            else
              (cd "$dir" && tar czf "../../release/${name}.tar.gz" .)
            fi
          done

          echo "::group::Release Assets"
          ls -la release/
          echo "::endgroup::"

      - name: Generate Checksums
        run: |
          cd release
          echo "## Checksums (SHA256)" > CHECKSUMS.txt
          echo "" >> CHECKSUMS.txt
          for f in *; do
            echo "- \`$f\`: \`$(sha256sum "$f" | cut -d' ' -f1)\`" >> CHECKSUMS.txt
          done
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          tag_name: ${{ github.ref_name }}
          name: Broadcast Overlay System ${{ github.ref_name }}
          body_path: release/CHECKSUMS.txt
          files: release/*.zip
          fail_on_unmatched_files: true
