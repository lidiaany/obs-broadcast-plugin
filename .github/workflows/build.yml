jobs:

build:
name: ${{ matrix.name }}

```
strategy:
  fail-fast: false

  matrix:
    include:

      # ============================================================
      # LINUX
      # ============================================================

      - os: ubuntu-24.04
        name: "🐧 Ubuntu 24.04"
        shell: bash
        generator: Ninja
        artifact: linux-x86_64

      # ============================================================
      # WINDOWS
      # ============================================================

      - os: windows-2022
        name: "🪟 Windows 2022"
        shell: pwsh
        generator: "Visual Studio 17 2022"
        cmake_arch: "-A x64"
        artifact: windows-x64

      # ============================================================
      # macOS
      # ============================================================

      - os: macos-15
        name: "🍏 macOS 15"
        shell: bash
        generator: Ninja
        artifact: macos-universal

runs-on: ${{ matrix.os }}

defaults:
  run:
    shell: ${{ matrix.shell }}

steps:

  # ================================================================
  # CHECKOUT
  # ================================================================

  - name: Checkout
    uses: actions/checkout@v4

  # ================================================================
  # CCACHE
  # ================================================================

  - name: Setup ccache
    if: runner.os != 'Windows'
    uses: hendrikmuhs/ccache-action@v1.2
    with:
      max-size: 500M

  # ================================================================
  # LINUX DEPENDENCIES
  # ================================================================

  - name: Install Dependencies (Linux)
    if: runner.os == 'Linux'
    run: |
      sudo add-apt-repository ppa:obsproject/obs-studio -y

      sudo apt-get update

      sudo apt-get install -y \
        libobs-dev \
        cmake \
        ninja-build \
        pkg-config \
        build-essential

  # ================================================================
  # WINDOWS DEPENDENCIES
  # ================================================================

  - name: Download OBS SDK (Windows)
    if: runner.os == 'Windows'
    run: |

      $tag = "$env:OBS_VERSION"

      $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/${tag}/OBS-Studio-${tag}-Windows-x64.zip"

      $zipPath = "$env:TEMP\obs-sdk.zip"

      $extractPath = "${{ github.workspace }}\obs-sdk"

      Write-Host "::group::Downloading OBS SDK"
      Write-Host "URL: $sdkUrl"

      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

      Invoke-WebRequest `
        -Uri $sdkUrl `
        -OutFile $zipPath `
        -UseBasicParsing

      Write-Host "::endgroup::"

      Write-Host "::group::Extracting OBS SDK"

      Expand-Archive `
        -Path $zipPath `
        -DestinationPath $extractPath `
        -Force

      Remove-Item $zipPath -Force

      Write-Host "Extracted to: $extractPath"

      Get-ChildItem $extractPath | Select-Object Name

      Write-Host "::endgroup::"

  # ================================================================
  # WINDOWS CMAKE DETECTION
  # ================================================================

  - name: Detect OBS CMake Path
    if: runner.os == 'Windows'
    run: |

      $paths = @(
        "${{ github.workspace }}\obs-sdk\cmake",
        "${{ github.workspace }}\obs-sdk\lib\cmake",
        "${{ github.workspace }}\obs-sdk\obs-studio\cmake"
      )

      foreach ($p in $paths) {

        if (Test-Path $p) {

          Write-Host "Found CMake path: $p"

          echo "OBS_CMAKE_PATH=$p" >> $env:GITHUB_ENV

          exit 0
        }
      }

      Write-Error "OBS CMake path not found"

  # ================================================================
  # macOS DEPENDENCIES
  # ================================================================

  - name: Install Dependencies (macOS)
    if: runner.os == 'macOS'
    run: |

      brew install ninja

      if [[ ! -d "/Applications/OBS.app" ]]; then
        brew install --cask obs-studio
      fi

      EXPECTED="/Applications/OBS.app/Contents/Frameworks/cmake"

      if [[ ! -d "$EXPECTED" ]]; then
        echo "OBS cmake path not found"
        exit 1
      fi

  # ================================================================
  # CONFIGURE
  # ================================================================

  - name: Configure CMake (Linux/macOS)
    if: runner.os != 'Windows'
    run: |

      if [[ "${{ runner.os }}" == "Linux" ]]; then
        PREFIX="/usr/lib/x86_64-linux-gnu/cmake"
      else
        PREFIX="/Applications/OBS.app/Contents/Frameworks/cmake"
      fi

      cmake \
        -S . \
        -B build \
        -G "${{ matrix.generator }}" \
        -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} \
        -DCMAKE_PREFIX_PATH="$PREFIX" \
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" \
        -DCMAKE_C_COMPILER_LAUNCHER=ccache \
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

  - name: Configure CMake (Windows)
    if: runner.os == 'Windows'
    run: |

      cmake `
        -S . `
        -B build `
        -G "${{ matrix.generator }}" `
        ${{ matrix.cmake_arch }} `
        -DCMAKE_PREFIX_PATH="$env:OBS_CMAKE_PATH" `
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\install"

  # ================================================================
  # BUILD
  # ================================================================

  - name: Build (Linux/macOS)
    if: runner.os != 'Windows'
    run: |

      cmake --build build \
        --config ${{ env.CMAKE_BUILD_TYPE }} \
        --parallel

  - name: Build (Windows)
    if: runner.os == 'Windows'
    run: |

      cmake --build build `
        --config $env:CMAKE_BUILD_TYPE `
        --parallel

  # ================================================================
  # INSTALL
  # ================================================================

  - name: Install
    run: |

      cmake --install build --config ${{ env.CMAKE_BUILD_TYPE }}

  # ================================================================
  # PREPARE ARTIFACTS
  # ================================================================

  - name: Prepare Artifacts
    shell: bash
    run: |

      mkdir -p artifacts

      cp -r install/* artifacts/ || true

      echo "::group::Artifacts"

      find artifacts -type f | sort || true

      echo "::endgroup::"

  # ================================================================
  # UPLOAD
  # ================================================================

  - name: Upload Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: ${{ env.PLUGIN_NAME }}-${{ matrix.artifact }}-${{ env.OBS_VERSION }}
      path: artifacts/
```

# ====================================================================

# RELEASE

# ====================================================================

release:

```
name: "📦 Release"

if: startsWith(github.ref, 'refs/tags/v')

needs: build

runs-on: ubuntu-24.04

permissions:
  contents: write

steps:

  - name: Download Artifacts
    uses: actions/download-artifact@v4
    with:
      path: release-assets

  - name: Package
    run: |

      mkdir -p release

      for dir in release-assets/*; do

        name=$(basename "$dir")

        if [[ "$name" == *windows* ]]; then

          (
            cd "$dir"
            7z a "../../release/${name}.zip" .
          )

        else

          (
            cd "$dir"
            tar czf "../../release/${name}.tar.gz" .
          )

        fi
      done

  - name: Checksums
    run: |

      cd release

      sha256sum * > SHA256SUMS.txt

      cat SHA256SUMS.txt

  - name: Create Release
    uses: softprops/action-gh-release@v2
    with:
      draft: true
      prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
      tag_name: ${{ github.ref_name }}
      files: |
        release/*
